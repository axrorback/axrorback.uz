{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="{% url 'protected_media' path='images/favicon.ico' %}" type="image/x-icon">
  <link rel="icon" href="{% url 'protected_media' path='images/favicon.ico' %}" type="image/x-icon">
  <title>{% block title %}Ahrorjon-DevOps Engineer{% endblock %}</title>

  <meta name="description" content="Ahrorjon Ibrohimjonov - DevOps & Python Engineer.">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

  <style>
   :root {
  --accent: #7C4DFF; /* Yoroqinroq binafsha */
  --accent-glow: rgba(124, 77, 255, 0.4);
  --bg-dark: #0a0f1b;
  --card-bg: rgba(255, 255, 255, 0.03);
  --border-light: rgba(255, 255, 255, 0.08);
  --text-main: #e2e8f0;
}

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at 0% 0%, #16213e 0%, #0a0f1b 50%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  line-height: 1.6;
}

/* Glassmorphism Navbar */
.custom-navbar {
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  margin-top: 1.5rem;
  padding: 0.8rem 1.5rem;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.navbar-brand {
  font-size: 1.4rem;
  letter-spacing: -0.5px;
}

.navbar-brand span {
  color: var(--accent);
  text-shadow: 0 0 15px var(--accent-glow);
}

/* Nav Linklari uchun effekt */
.nav-link {
  position: relative;
  font-weight: 500;
  margin: 0 5px;
  color: #94a3b8 !important;
}

.nav-link::after {
  content: '';
  position: absolute;
  width: 0;
  height: 2px;
  bottom: 0;
  left: 50%;
  background: var(--accent);
  transition: all 0.3s ease;
  transform: translateX(-50%);
  box-shadow: 0 0 10px var(--accent);
}

.nav-link:hover::after, .nav-link.active::after {
  width: 80%;
}

.nav-link:hover, .nav-link.active {
  color: #fff !important;
}

/* Footer va Ijtimoiy tarmoqlar */
footer {
  background: rgba(0, 0, 0, 0.2);
  backdrop-filter: blur(5px);
  padding: 40px 0;
  border-top: 1px solid var(--border-light);
}

.social-link {
  width: 45px;
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--border-light);
  color: #94a3b8 !important;
  transition: all 0.3s ease;
}

.social-link:hover {
  background: var(--accent);
  color: white !important;
  transform: translateY(-5px);
  box-shadow: 0 10px 20px rgba(124, 77, 255, 0.3);
}

/* Scroll progress */
#myBar {
  height: 3px;
  background: linear-gradient(to right, transparent, var(--accent));
  box-shadow: 0 0 10px var(--accent);
}

/* Animatsiya uchun */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

main {
  animation: fadeIn 0.8s ease-out;
}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div id="myBar"></div>

<div class="container-lg">
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'about' %}">axrorback<span>.dev</span></a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'about' %}">
              <i class="bi bi-house"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if 'achievements' in request.path %}active{% endif %}" href="{% url 'achievements' %}">
              <i class="bi bi-trophy"></i> Yutuqlar
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if 'blog' in request.path %}active{% endif %}" href="{% url 'blog' %}">
              <i class="bi bi-chat-left-text"></i> Blog
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://t.me/axror_contactbot" target="_blank">
              <i class="bi bi-robot"></i> Bot
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if 'contact' in request.path %}active{% endif %}" href="{% url 'contact' %}">
              <i class="bi bi-person-lines-fill"></i> Contact
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if 'ask_question' in request.path %}active{% endif %}" href="{% url 'ask_question' %}">
              <i class="bi bi-question-circle"></i> Savol
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-light">
    <div class="mb-3 d-flex justify-content-center flex-wrap gap-4">
      <a href="https://instagram.com/axrorback" target="_blank" class="social-link"><i class="bi bi-instagram fs-4"></i></a>
      <a href="https://twitter.com/axrorback" target="_blank" class="social-link"><i class="bi bi-twitter-x fs-4"></i></a>
      <a href="https://t.me/axrorback" target="_blank" class="social-link"><i class="bi bi-telegram fs-4"></i></a>
      <a href="https://facebook.com/axrorback" target="_blank" class="social-link"><i class="bi bi-facebook fs-4"></i></a>
      <a href="https://github.com/axrorback" target="_blank" class="social-link"><i class="bi bi-github fs-4"></i></a>
      <a href="mailto:axrorback@gmail.com" class="social-link"><i class="bi bi-envelope-at fs-4"></i></a>
      <a href="tel:+998931004005" class="social-link"><i class="bi bi-telephone-outbound fs-4"></i></a>
    </div>
    <div class="small text-secondary">
      © <span id="footerYear"></span> <strong>Ahrorjon Ibrohimjonov</strong>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('footerYear').textContent = new Date().getFullYear();

  // Xatolikni oldini olish uchun tekshiruv bilan yozildi
  window.onscroll = function() {
    let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
    let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    let scrolled = (winScroll / height) * 100;
    let bar = document.getElementById("myBar");
    if(bar) {
      bar.style.width = scrolled + "%";
    }
  };
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
