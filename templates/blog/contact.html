{% extends 'base.html' %}
{% block title %}Contact Me{% endblock %}

{% block extra_head %}
<style>
    .contact-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
    }

    .contact-card:hover {
        transform: translateY(-10px);
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--card-color, #6C5CE7);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .icon-box {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--card-color, #6C5CE7);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        border-radius: 18px;
        font-size: 1.8rem;
        transition: 0.3s;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .contact-card:hover .icon-box {
        background: var(--card-color, #6C5CE7);
        color: white;
        transform: scale(1.1) rotate(10deg);
        box-shadow: 0 0 20px var(--card-color);
    }

    .contact-link-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        border-radius: 12px;
        padding: 8px 25px;
        text-decoration: none;
        transition: 0.3s;
    }

    .contact-card:hover .contact-link-btn {
        background: var(--card-color, #6C5CE7);
        border-color: var(--card-color);
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="row g-4">
    <div class="col-md-6 col-lg-4">
        <div class="contact-card text-center p-4 h-100" style="--card-color: #6C5CE7;">
            <div class="icon-box"><i class="bi bi-envelope"></i></div>
            <h5 class="fw-bold">Email</h5>
            <p class="text-secondary">axrorback@gmail.com</p>
            <a href="mailto:axrorback@gmail.com" class="btn contact-link-btn mt-2">Xat yozish</a>
        </div>
    </div>

    <div class="col-md-6 col-lg-4">
        <div class="contact-card text-center p-4 h-100" style="--card-color: #0088cc;">
            <div class="icon-box"><i class="bi bi-telegram"></i></div>
            <h5 class="fw-bold">Telegram</h5>
            <p class="text-secondary">@axrorback</p>
            <a href="https://t.me/axrorback" target="_blank" class="btn contact-link-btn mt-2">Bog'lanish</a>
        </div>
    </div>

    <div class="col-md-6 col-lg-4">
        <div class="contact-card text-center p-4 h-100" style="--card-color: #E1306C;">
            <div class="icon-box"><i class="bi bi-instagram"></i></div>
            <h5 class="fw-bold">Instagram</h5>
            <p class="text-secondary">@axrorback</p>
            <a href="https://instagram.com/axrorback" target="_blank" class="btn contact-link-btn mt-2">Profil</a>
        </div>
    </div>

    <div class="contact-card text-center p-4 h-100" style="--card-color: #333;">
        <div class="icon-box"><i class="bi bi-github"></i></div>
        <h5 class="fw-bold">GitHub</h5>
        <p class="text-secondary">axrorback</p>
        <a href="https://github.com/axrorback" target="_blank" class="btn contact-link-btn mt-2">Ko'rish</a>
    </div>
</div>
{% endblock %}
