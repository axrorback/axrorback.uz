<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERROR_404: PAGE_NOT_FOUND</title>
  <script
          src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.1/dist/dotlottie-wc.js"
          type="module"
  ></script>
  <style>
    :root {
      --neon-green: #39ff14;
      --neon-red: #ff3131;
      --bg-black: #0a0a0a;
      --text-main: #ffffff;
      --terminal-gray: #444444;
      --font-mono: 'Fira Code', 'Courier New', monospace;
    }

    /* --- LIGHT MODE REJIMI --- */
    body.light-mode {
      --bg-black: #f8fafc;
      --text-main: #1a202c;
      --terminal-gray: #718096;
      --neon-green: #008f11;
      --neon-red: #d32f2f;
    }

    body {
      background: var(--bg-black);
      color: var(--text-main);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
      transition: background 0.3s ease;
    }

    /* Kiber fon effekti (faqat dark modeda yaxshi ko'rinadi) */
    body:not(.light-mode)::before {
      content: " ";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
      linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 10;
    }

    dotlottie-wc {
      width: 400px;
      max-width: 85vw;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(57, 255, 20, 0.2));
    }

    .error-code {
      font-size: clamp(3rem, 15vw, 5rem);
      color: var(--neon-red);
      text-shadow: 0 0 20px rgba(255, 49, 49, 0.3);
      margin: 0;
      font-weight: 900;
    }

    .status-msg {
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: var(--neon-green);
      margin-top: 15px;
      max-width: 600px;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .terminal-text {
      color: var(--terminal-gray);
      font-size: clamp(0.8rem, 3vw, 0.9rem);
      margin-top: 10px;
      line-height: 1.5;
    }

    .btn-home {
      margin-top: 40px;
      display: inline-block;
      background: transparent;
      color: var(--neon-green);
      padding: 12px 35px;
      border: 1px solid var(--neon-green);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      font-family: var(--font-mono);
      text-transform: uppercase;
      position: relative;
      z-index: 20;
    }

    .btn-home:hover {
      background: var(--neon-green);
      color: #000 !important;
      box-shadow: 0 0 20px var(--neon-green);
      transform: translateY(-3px);
    }

    /* Glitch effekti */
    .glitch {
      position: relative;
    }

    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 2px;
      text-shadow: -1px 0 var(--neon-red);
      top: 0;
      color: var(--text-main);
      background: var(--bg-black);
      overflow: hidden;
      clip: rect(0,900px,0,0);
      animation: noise-anim 2s infinite linear alternate-reverse;
    }

    @keyframes noise-anim {
      0% { clip: rect(10px, 9999px, 50px, 0); }
      100% { clip: rect(80px, 9999px, 100px, 0); }
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .btn-home {
        width: 100%;
        padding: 12px 0;
      }
    }
  </style>
</head>
<body id="error-body">
<div class="glitch" data-text="404">
  <h1 class="error-code">404</h1>
</div>

<dotlottie-wc
        src="https://lottie.host/26a42d90-1005-4106-8f78-55dd91130587/kg9WDVwrkU.lottie"
        autoplay
        loop
></dotlottie-wc>

<p class="status-msg">
  [!] FATAL_ERROR: PAGE_NOT_FOUND_IN_SERVER
</p>

<p class="terminal-text">
  Ehh... afsuski siz izlagan sahifa topilmadi. <br>
  Balki u hozir bekatda Wi-Fi izlayotgandir... 📡
</p>

<a href="/" class="btn-home">> RETURN_TO_BASE</a>

<script>
  // Tizim rang rejimini tekshirish (Local Storage dan)
  function applyTheme() {
    const theme = localStorage.getItem('theme') || 'dark';
    if (theme === 'light') {
      document.body.classList.add('light-mode');
    } else {
      document.body.classList.remove('light-mode');
    }
  }

  // Sahifa yuklanganda rejimni qo'llash
  applyTheme();

  console.log("%c [ERROR] 404: Resource not found.", "color: #ff3131; font-weight: bold;");
</script>
</body>
</html>
